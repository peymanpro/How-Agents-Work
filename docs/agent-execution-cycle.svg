<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How Agents Work — execution loop</title>
  <desc id="desc">Animated architecture diagram showing Goal, Model Context, Model, Raw Response, Parser, Decision, Runtime Validation, Tool, Observation, State and Memory, and Re-plan in an iterative loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e12"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8b9a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63a4ff"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>

  <g opacity=".24" stroke="#24303d" stroke-width="1">
    <path d="M70 120H1330M70 300H1330M70 480H1330M70 660H1330"/>
    <path d="M180 70V690M420 70V690M660 70V690M900 70V690M1140 70V690"/>
  </g>

  <text x="84" y="68" fill="#f2f5f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing=".4">HOW AGENTS WORK</text>
  <text x="84" y="95" fill="#7f8b9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Model proposes. Runtime validates and executes. Observation reshapes the next decision.</text>

  <rect x="82" y="132" width="504" height="466" rx="24" fill="#0e141b" stroke="#273441"/>
  <rect x="610" y="132" width="708" height="466" rx="24" fill="#0e141b" stroke="#273441"/>

  <text x="110" y="166" fill="#63a4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">MODEL</text>
  <text x="638" y="166" fill="#b7c1cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">RUNTIME</text>

  <g fill="none" stroke="#4f5b68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M174 246H330"/>
    <path d="M426 246H530"/>
    <path d="M626 246V350H650"/>
    <path d="M746 350H826"/>
    <path d="M922 350H1002"/>
    <path d="M1098 350V246H1102"/>
    <path d="M1198 246H1248"/>
    <path d="M1248 246V470H1256"/>
    <path d="M1160 470H960"/>
    <path d="M864 470H760"/>
  </g>

  <path d="M760 520C760 650 505 680 350 610C275 576 240 536 240 488V390C240 330 300 300 360 300"
        fill="none" stroke="#63a4ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <path d="M598 190V570" stroke="#24303d" stroke-width="1"/>
  <circle cx="598" cy="350" r="5" fill="#63a4ff"/>
  <circle cx="598" cy="350" r="12" fill="none" stroke="#63a4ff">
    <animate attributeName="r" values="10;22;10" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;0;.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="110" y="212" width="64" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <circle cx="142" cy="246" r="19" fill="#10161d" stroke="#63a4ff" stroke-width="2"/>
      <text x="142" y="251" text-anchor="middle" fill="#f2f5f8" font-size="12" font-weight="700">G</text>
      <text x="142" y="304" text-anchor="middle" fill="#b7c1cc" font-size="12">Goal</text>
    </g>
    <g>
      <rect x="330" y="212" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="378" y="244" text-anchor="middle" fill="#f2f5f8" font-size="12" font-weight="700">MODEL</text>
      <text x="378" y="262" text-anchor="middle" fill="#7f8b9a" font-size="11">CONTEXT</text>
      <text x="378" y="304" text-anchor="middle" fill="#b7c1cc" font-size="12">Model Context</text>
    </g>
    <g>
      <rect x="530" y="212" width="96" height="68" rx="16" fill="#162335" stroke="#63a4ff"/>
      <text x="578" y="251" text-anchor="middle" fill="#f2f5f8" font-size="13" font-weight="700">Model</text>
      <text x="578" y="304" text-anchor="middle" fill="#9fb0c2" font-size="12">Model</text>
    </g>
    <g>
      <rect x="650" y="316" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="698" y="341" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">RAW</text>
      <text x="698" y="358" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">RESPONSE</text>
      <text x="698" y="409" text-anchor="middle" fill="#b7c1cc" font-size="12">Raw Response</text>
    </g>
    <g>
      <rect x="826" y="316" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="874" y="351" text-anchor="middle" fill="#f2f5f8" font-size="13" font-weight="700">Parser</text>
      <text x="874" y="409" text-anchor="middle" fill="#b7c1cc" font-size="12">Parser</text>
    </g>
    <g>
      <rect x="1002" y="316" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="1050" y="351" text-anchor="middle" fill="#f2f5f8" font-size="13" font-weight="700">Decision</text>
      <text x="1050" y="409" text-anchor="middle" fill="#b7c1cc" font-size="12">Decision</text>
    </g>
    <g>
      <rect x="1102" y="212" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="1150" y="240" text-anchor="middle" fill="#f2f5f8" font-size="10" font-weight="700">RUNTIME</text>
      <text x="1150" y="258" text-anchor="middle" fill="#f2f5f8" font-size="10" font-weight="700">VALIDATION</text>
      <text x="1150" y="304" text-anchor="middle" fill="#b7c1cc" font-size="12">Validation</text>
    </g>
    <g>
      <rect x="1160" y="436" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="1208" y="471" text-anchor="middle" fill="#f2f5f8" font-size="13" font-weight="700">Tool</text>
      <text x="1208" y="529" text-anchor="middle" fill="#b7c1cc" font-size="12">Tool</text>
    </g>
    <g>
      <rect x="864" y="436" width="96" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="912" y="462" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">OBSERVATION</text>
      <text x="912" y="478" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">→ EVIDENCE</text>
      <text x="912" y="529" text-anchor="middle" fill="#b7c1cc" font-size="12">Observation</text>
    </g>
    <g>
      <rect x="660" y="436" width="100" height="68" rx="16" fill="#151c24" stroke="#364452"/>
      <text x="710" y="461" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">STATE +</text>
      <text x="710" y="478" text-anchor="middle" fill="#f2f5f8" font-size="11" font-weight="700">MEMORY</text>
      <text x="710" y="529" text-anchor="middle" fill="#b7c1cc" font-size="12">State + Memory</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="312" y="544" width="104" height="34" rx="17" fill="#162335" stroke="#355b82"/>
    <text x="364" y="566" text-anchor="middle" fill="#a9cdf5" font-size="12" font-weight="700">RE-PLAN</text>
  </g>

  <circle r="7" fill="#63a4ff">
    <animateMotion dur="6s" repeatCount="indefinite" path="M174 246H330"/>
  </circle>
  <circle r="7" fill="#63a4ff">
    <animateMotion begin="1s" dur="6s" repeatCount="indefinite" path="M426 246H530"/>
  </circle>
  <circle r="7" fill="#63a4ff">
    <animateMotion begin="2s" dur="6s" repeatCount="indefinite" path="M626 246V350H650"/>
  </circle>
  <circle r="7" fill="#63a4ff">
    <animateMotion begin="3s" dur="6s" repeatCount="indefinite" path="M746 350H826"/>
  </circle>
  <circle r="7" fill="#63a4ff">
    <animateMotion begin="4s" dur="6s" repeatCount="indefinite" path="M922 350H1002"/>
  </circle>
  <circle r="7" fill="#63a4ff">
    <animateMotion begin="5s" dur="6s" repeatCount="indefinite" path="M1098 350V246H1102"/>
  </circle>

  <g fill="none" stroke="#63a4ff">
    <circle cx="578" cy="246" r="26" opacity=".35">
      <animate attributeName="r" values="24;35;24" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="246" r="26" opacity=".28">
      <animate attributeName="r" values="24;35;24" dur="2.2s" begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;0;.45" dur="2.2s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="470" r="25" opacity=".25">
      <animate attributeName="r" values="23;34;23" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;0;.4" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="84" y="650" fill="#7f8b9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">OPEN-ENDED DECISION • UNCERTAINTY • TOOL CALLING • GUARDRAILS • OBSERVATION • MEMORY • ITERATION</text>
  <text x="84" y="679" fill="#4f5b68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">An inspectable execution laboratory — not a production agent framework.</text>
</svg>